# Full stack: database, migrator (one-shot) and API all run in Docker.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: appointmentscheduler-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # The 2022 image ships sqlcmd under /opt/mssql-tools18, which requires -C for the self-signed cert.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrator:
    build:
      context: .
      dockerfile: src/AppointmentScheduler.DatabaseMigration/Dockerfile
    container_name: appointmentscheduler-migrator
    command: ["--demo"]
    environment:
      ConnectionStrings__AppointmentScheduler: "Server=sqlserver;Database=AppointmentScheduler;User Id=sa;Password=Your_strong_Passw0rd;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/AppointmentScheduler.Api/Dockerfile
    container_name: appointmentscheduler-api
    ports:
      - "5109:8080"
    environment:
      ConnectionStrings__AppointmentScheduler: "Server=sqlserver;Database=AppointmentScheduler;User Id=sa;Password=Your_strong_Passw0rd;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  sqlserver-data:
